name: Deploy BizPro API to Cloud Run

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: bizpro-api
  GCP_PROJECT_ID: project-d12aa5f3-be97-4827-b63
  GCP_REGION: me-central1
  GAR_REPOSITORY: bizpro-api
  CLOUD_RUN_SERVICE: bizpro-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/237507579958/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: bizpro-cloud-run-deployer@project-d12aa5f3-be97-4827-b63.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build image tag
        run: |
          echo "IMAGE_URI=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build --file apps/api/Dockerfile --tag "${IMAGE_URI}" .

      - name: Push Docker image
        run: docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE_URI}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --quiet \
            --port 8080 \
            --update-env-vars "NODE_ENV=production,MONGODB_DB_NAME=vickins_business_os,JWT_EXPIRES_IN=7d" \
            --update-secrets "MONGODB_URI=MONGODB_URI:latest,JWT_SECRET=JWT_SECRET:latest,SUPPORT_API_KEY=SUPPORT_API_KEY:latest,ADMIN_API_SIGNING_SECRET=ADMIN_API_SIGNING_SECRET:latest,PLATFORM_ERROR_INGEST_KEY=PLATFORM_ERROR_INGEST_KEY:latest"
